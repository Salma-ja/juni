<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1B45"/><stop offset="1" stop-color="#170F28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#E90076" stop-opacity="0.55"/><stop offset="1" stop-color="#E90076" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6DDF2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <g opacity="0.18" stroke="#FF8AC4" stroke-width="2" fill="none">
    <circle cx="930" cy="330" r="200"/><circle cx="930" cy="330" r="260"/>
  </g>
  <!-- car top view with 4 seats -->
  <g transform="translate(790 150)">
    <rect x="0" y="0" width="280" height="370" rx="110" fill="url(#car)"/>
    <rect x="36" y="40" width="208" height="70" rx="30" fill="#2A1B45" opacity="0.9"/>
    <rect x="36" y="280" width="208" height="50" rx="24" fill="#2A1B45" opacity="0.9"/>
    <circle cx="95" cy="160" r="34" fill="#E90076"/>
    <circle cx="185" cy="160" r="34" fill="#E90076"/>
    <circle cx="95" cy="240" r="34" fill="#E90076"/>
    <circle cx="185" cy="240" r="34" fill="#FFFFFF" stroke="#E90076" stroke-width="6" stroke-dasharray="12 9"/>
    <text x="185" y="252" font-family="Helvetica Neue, Arial" font-size="34" font-weight="800" fill="#E90076" text-anchor="middle">+</text>
  </g>
  <g font-family="Helvetica Neue, Arial">
    <rect x="80" y="110" width="210" height="52" rx="26" fill="#E90076"/>
    <text x="185" y="145" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LAST SEAT</text>
    <text x="80" y="300" font-size="150" font-weight="900" fill="#FFFFFF" letter-spacing="-6">+30<tspan font-size="56" font-weight="800" fill="#FF8AC4" letter-spacing="0" dx="18">pts</tspan></text>
    <text x="80" y="380" font-size="40" font-weight="700" fill="#FFFFFF">Take the 4th seat,</text>
    <text x="80" y="432" font-size="40" font-weight="700" fill="#FFFFFF">send the car.</text>
    <text x="80" y="510" font-size="28" font-weight="600" fill="#BFB2D6">Points land the moment you book</text>
  </g>
</svg>
