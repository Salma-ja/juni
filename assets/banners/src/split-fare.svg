<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34234D"/><stop offset="1" stop-color="#4B1F6B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g opacity="0.12" fill="#FF8AC4"><circle cx="980" cy="300" r="260"/></g>
  <!-- four coins -->
  <g font-family="Helvetica Neue, Arial" font-weight="900" text-anchor="middle">
    <g transform="translate(860 210)"><circle r="78" fill="#E90076"/><circle r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/><text y="16" font-size="46" fill="#FFFFFF">¼</text></g>
    <g transform="translate(1040 210)"><circle r="78" fill="#FF8AC4"/><circle r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4"/><text y="16" font-size="46" fill="#FFFFFF">¼</text></g>
    <g transform="translate(860 400)"><circle r="78" fill="#FFFFFF"/><circle r="62" fill="none" stroke="#E90076" stroke-opacity="0.3" stroke-width="4"/><text y="16" font-size="46" fill="#E90076">¼</text></g>
    <g transform="translate(1040 400)"><circle r="78" fill="#FFD1E8"/><circle r="62" fill="none" stroke="#E90076" stroke-opacity="0.3" stroke-width="4"/><text y="16" font-size="46" fill="#C20062">¼</text></g>
  </g>
  <g font-family="Helvetica Neue, Arial">
    <text x="80" y="150" font-size="28" font-weight="800" fill="#FF8AC4" letter-spacing="3">SHARE THE CAR</text>
    <text x="80" y="250" font-size="40" font-weight="700" fill="#FFFFFF">Seats from</text>
    <text x="80" y="370" font-size="130" font-weight="900" fill="#FFFFFF" letter-spacing="-5">1.12<tspan font-size="52" font-weight="800" fill="#FF8AC4" letter-spacing="0" dx="16">JD</tspan></text>
    <text x="80" y="450" font-size="34" font-weight="600" fill="#D9CDEA">Pay only for your distance.</text>
    <text x="80" y="498" font-size="34" font-weight="600" fill="#D9CDEA">Up to 70% less than solo.</text>
  </g>
</svg>
