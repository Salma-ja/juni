<!doctype html>
<html lang="en">
  <body style="background:#f8f5fa;color:#272039;font-family:Arial,sans-serif;padding:24px">
    <main style="background:#fff;border-radius:18px;margin:auto;max-width:460px;padding:24px">
      <p style="color:#ec007a;font-weight:bold;letter-spacing:3px">JUNI</p>
      <h1 style="font-size:22px">Verify your university email</h1>
      <p>Enter this code in JUNI to confirm your email address.</p>
      <p style="color:#ec007a;font-size:28px;font-weight:bold;letter-spacing:5px">{{ .Token }}</p>
      <p>If you didn't request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
